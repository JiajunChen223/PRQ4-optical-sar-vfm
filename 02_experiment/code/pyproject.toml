[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geotoken3path"
version = "0.1.0"
description = "ResearchPilot scaffold for budgeted optical-SAR VFM token routing"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "PyYAML>=6.0",
  "rasterio>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
pythonpath = ["src"]
