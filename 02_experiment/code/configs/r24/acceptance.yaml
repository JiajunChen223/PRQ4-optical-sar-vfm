# R24 SkySense++ S2 ICE-Exact: frozen acceptance runtime contract.
# Mirrors the audited R21 acceptance plan (precision/micro-batch/effective
# batch/optimizer) with the R24 task-specific knobs: receiver contract and
# segmentation head schedule.
target_gpu: RTX_3090_24GB
local_gpu_probe_allowed: false
cloud_preflight_required: true
precision: amp
micro_batch: 16
effective_batch: 32
gradient_accumulation: 2
num_workers: protocol_locked_on_cloud
checkpointing: enabled_if_cloud_preflight_requires
real_data_allowed: false
real_weights_allowed: false
execution_scale: acceptance
test_seal_status: sealed
seed: 0
# R24 receiver contract: 'a' executes all 24 backbone layers, 'b' executes the
# certified ICE prefix (layers 0..11, grid layer 11).
contract: b
resolution: 120
num_classes: 11
head_seed: 0
annotation: gt
epochs: 24
optimizer:
  name: adamw
  learning_rate: 0.0001
  weight_decay: 0.05
  betas: [0.9, 0.999]
scheduler:
  name: cosine_with_warmup
  warmup_fraction: 0.05
gradient_clip_norm: 1.0
objective_name: ce_lovasz
augmentation:
  name: paired_geometric_v1
  enabled: true
  train_only: true
  deterministic: true
  orientation_space: D4
  operations: [horizontal_flip, vertical_flip, rotate_90, rotate_180, rotate_270, transpose, anti_transpose]
