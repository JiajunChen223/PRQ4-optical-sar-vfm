name: R21 ICE synthetic CI

on:
  workflow_dispatch:
  push:
    branches: [r21-ice-vfm-exact]
  pull_request:
    branches: [master]
    paths:
      - "02_experiment/code/**"
      - ".github/workflows/r21-ice-synthetic-ci.yml"

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: 02_experiment/code
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 02_experiment/code/pyproject.toml

      - name: Install package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Run complete synthetic test suite
        run: pytest -q
